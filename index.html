y:block}.section h2{font-size:19px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tablewrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:12px;background:white}table{border-collapse:collapse;width:100%;min-width:800px;font-size:13px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#eef5f1;color:#34574d;z-index:1}tr:hover td{background:#fbfdfc}.pill{padding:4px 8px;border-radius:20px;font-size:11px;background:#eaf5ef;color:#176149}.pill.red{background:#ffe9e7;color:#a82019}.pill.amber{background:#fff3dc;color:#985a00}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d9e3dd;border-radius:8px;padding:10px;background:#fff;font:inherit;min-width:0}.field textarea{min-height:40px}.panel{margin:12px 0}.muted{color:var(--muted);font-size:12px}.notice{padding:12px;border-radius:10px;background:#eff7f2;color:#36584b;margin:10px 0}.calcresult{font-size:16px;line-height:2;color:var(--ink)}.foot{padding:24px 4px;color:var(--muted);font-size:11px;text-align:center}.actions{display:flex;gap:5px}.small{padding:6px 9px;font-size:12px}.empty{text-align:center;padding:35px;color:var(--muted)}

function formOpen(id,editIndex=null){let c=configs[id],fields=c.fields,editing=editIndex!==null,existing=editing?(db[id]||[])[editIndex]:null;let box=document.createElement('div');box.id='modal';box.style='position:fixed;inset:0;background:#10221dbb;z-index:10;display:grid;place-items:center;padding:14px';box.innerHTML=`<div class="card" style="width:min(900px,100%);max-height:90vh;overflow:auto"><div class="row"><h2>${editing?'ویرایش':'افزودن به'} ${c.title}</h2><button class="btn light" onclick="document.getElementById('modal').remove()">بستن</button></div><form id="entryForm"><div class="formgrid">${fields.map(([key,label,type,options])=>`<div class="field"><label>${label}</label>${type==='select'?`<select name="${key}">${options.split(',').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${key}" type="${type==='date'?'text':type}" ${type==='date'?'inputmode="text" autocomplete="off" placeholder="۱۴۰۵/۰۱/۰۱"':''} ${type==='number'?'step="any"':''}>`}</div>`).join('')}</div><div class="toolbar"><button class="btn" type="submit">ذخیره</button><button class="btn light" type="button" onclick="document.getElementById('modal').remove()">انصراف</button></div></form></div>`;document.body.append(box);if(editing&&existing){for(let [key] of fields){let el=document.querySelector(`#entryForm [name=\"${key}\"]`);if(el&&existing[key]!=null)el.value=existing[key]}}document.getElementById('entryForm').onsubmit=e=>{e.preventDefault();let ob={};new FormData(e.target).forEach((v,k)=>{if(v==='')return;let f=fields.find(x=>x[0]===k);ob[k]=f&&f[2]==='number'?nval(v):v;if(f&&f[2]==='date'){let d=parseDate(v);ob[k]=d&&!isNaN(d)?d.toISOString().slice(0,10):v}});if(ob.nationalId)ob.nationalId=String(ob.nationalId).replace(/[^0-9۰-۹٠-٩]/g,'').padStart(10,'0');if(editing)db[id][editIndex]={...existing,...ob};else (db[id]||(db[id]=[])).unshift(ob);box.remove();save()}}function editEntry(id,i){if(!configs[id]||!db[id]||!db[id][i])return;formOpen(id,i)}function del(id,i){if(!co function ras(){return `<h2>راس‌گیری و محاسبه بهره</h2><div class="notice">راس وزنی = مجموع (مبلغ × روز فاصله تا تاریخ مبنا) ÷ مجموع مبالغ. تاریخ راس و بهره روزشمار به‌صورت تخمینی محاسبه می‌شود.</div><div class="card panel"><div class="row"><h2>ورود اسناد</h2><button class="btn" onclick="addRasRow()">＋ افزودن سند</button></div><div class="formgrid"><div class="field"><label>تاریخ مبنا (شمسی)</label><input id="rasBase" type="text" inputmode="text" autocomplete="off" value="${todayJ()}" placeholder="۱۴۰۵/۰۱/۰۱"></div><div class="field"><label>نرخ بهره سالانه (%)</label><input id="rasRate" type="number" value="0" step="0.1"></div></div><div class="tablewrap" style="margin-top:12px"><table style="min-width:500px"><thead><tr><th>مبلغ (تومان)</th><th>تاریخ سررسید شمسی</th><th>عملیات</th></tr></thead><tbody id="rasRows">${rasRow(100000000,todayJ())}${rasRow(50000000,todayJ())}</tbody></table></div><div class="toolbar"><button class="btn" onclick="calcRas()">محاسبه راس</button></div><div id="rasOut" class="calcresult"></div></div><div class="card panel" style="border:2px solid var(--green);box-shadow:0 5px 20px rgba(23,105,74,.14)"><div class="row"><h2 style="margin:0;color:var(--green)">محاسبه وام</h2><span class="notice" style="margin:0">سود ساده بر اساس درصد ماهانه</span></div><p class="muted">فرمول: اصل وام × درصد ماهانه ÷ ۱۰۰ × تعداد ماه؛ سپس سود به اصل اضافه و بر تعداد اقساط تقسیم می‌شود.</p><div class="formgrid" style="margin-top:12px"><div class="field"><label>مبلغ اصل وام (تومان)</label><input id="loanPrincipal" type="text" inputmode="numeric" placeholder="مثلاً ۱۰۰٬۰۰۰٬۰۰۰" oninput="calcLoan()"></div><div class="field"><label>درصد سود ماهانه (%) (مثلاً ۲ برای ۲٪)</label><input id="loanRate" type="text" inputmode="decimal" placeholder="مثلاً ۲" oninput="calcLoan()"></div><div class="field"><label>تعداد اقساط — ماه</label><input id="loanMonths" type="text" inputmode="numeric" placeholder="مثلاً ۱۲" oninput="calcLoan()"></div></div><div id="loanOut" class="calcresult" style="margin-top:12px" aria-live="polite">مبلغ اصل وام، درصد ماهانه و تعداد اقساط را وارد کنید.</div></div>`}function loanFormat(el,decimal=false){const start=el.selectionStart??el.value.length;const before=normalizeDigits(el.value.slice(0,start)).replace(/[٬,\s]/g,'').replace(decimal?/[^0-9.]/g:/[^0-9]/g,'');let logicalBefore=before;if(decimal){const dot=before.indexOf('.');if(dot>=0)logicalBefore=before.slice(0,dot+1)+before.slice(dot+1).replace(/\./g,'')}const target=logicalBefore.length;let raw=normalizeDigits(el.value).replace(/[٬,\s]/g,'').replace(decimal?/[^0-9.]/g:/[^0-9]/g,'');if(decimal){const dot=raw.indexOf('.');if(dot>=0)raw=raw.slice(0,dot+1)+raw.slice(dot+1).replace(/\./g,'')}let parts=raw.split('.');parts[0]=(parts[0]||'').replace(/\B(?=(\d{3})+(?!\d))/g,',');const formatted=toPersianDigits(parts.join('.'));el.value=formatted;let pos=0,logical=0;while(pos<formatted.length&&logical<target){const ch=formatted[pos];if(/[۰-۹]/.test(ch)||ch==='.')logical++;pos++}el.setSelectionRange(pos,pos)}function calcLoan(){let p=nval(document.getElementById('loanPrincipal')?.value),r=nval(document.getElementById('loanRate')?.value),m=nval(document.getElementById('loanMonths')?.value),o=document.getElementById('loanOut');if(!o)return;if(!(p>0&&m>0)){o.innerHTML='مبلغ اصل وام و تعداد اقساط معتبر را وارد کنید.';return}let interest=p*(r/100)*m,total=p+interest,installment=total/m;o.innerHTML=`جمع سود وام: <b>${fmt(Math.round(interest))} تومان</b><br>اصل و سود وام: <b>${fmt(Math.round(total))} تومان</b><br>مبلغ هر قسط (${fmt(m)} ماه): <b>${fmt(Math.round(installment))} تومان</b>`}function rasRow(amount=0,date=todayJ()){return `<tr><td><input class="ra" type="number" value="${amount}" style="width:100%;padding:9px;border:1px solid #d9e3dd;border-radius:8px"></td><td><input class="rd" type="text" inputmode="text" autocomplete="off" value="${date}" style="width:100%;padding:9px;border:1px solid #d9e3dd;border-radius:8px" placeholder="۱۴۰۵/۰۱/۰۱"></td><td><button class="btn danger small" onclick="this.closest('tr').remove()">حذف</button></td></tr>`}function addRasRow(){document.getElementById('rasRows').insertAdjacentHTML('beforeend',rasRow(0,todayJ()))}function calcRas(){let base=parseDate(document.getElementById('rasBase').value),rows=[...document.querySelectorAll('#rasRows tr')],total=0,weighted=0;if(!base){alert('تاریخ مبنا را به شکل شمسی وارد کنید.');return}let docs=[];for(let tr of rows){let amt=nval(tr.querySelector('.ra').value),dt=parseDate(tr.querySelector('.rd').value);if(amt>0&&dt){let days=dayDiff(base,dt);total+=amt;weighted+=amt*days;docs.push({amt,dt,days})}}if(!total){document.getElementById('rasOut').innerHTML='مبلغ معتبر وارد کنید.';return}let avg=Math.round(weighted/total),meanDate=new Date(base.getTime()+avg*86400000),rate=nval(document.getElementById('rasRate').value)/100,interest=docs.reduce((s,d)=>s+d.amt*rate*d.days/365,0);document.getElementById('rasOut').innerHTML=`جمع مبالغ: <b>${fmt(total)} تومان</b><br>میانگین وزنی: <b>${fmt(avg)} روز</b> از تاریخ مبنا<br>تاریخ راس: <b>${jstr(meanDate)}</b><br>بهره ${fmt(nval(document.getElementById('rasRate').value))}٪ سالانه تا سررسیدها: <b>${fmt(Math.round(interest))} تومان</b>`}function convertDate(){let j=document.getElementById('convJ'),g=document.getElementById('convG'),o=document.getElementById('convOut');if(!j||!g){return}if(j.value){let d=parseDate(j.value);if(d&&!isNaN(d))g.value=d.toISOString().slice(0,10)}if(g.value){let d=parseDate(g.value);if(d&&!isNaN(d))j.value=jstr(d)}o.textContent=`شمسی: ${j.value} · میلادی: ${g.value}`}

 Firebase به‌تنهایی محرمانه نیست؛ دسترسی را با Firebase Security Rules محدود کنید.</small></div><div class="card panel"><h2>اطلاعات موجود</h2><div class="grid">${metric('چک‌ها',fmt((db.checks||[]).length))}${metric('معاملات خودرو',fmt((db.sales||[]).length))}${metric('پرداخت‌ها',fmt((db.payments||[]).length))}${metric('دریافت‌ها',fmt((db.receipts||[]).length))}</div><div class="toolbar"><button class="btn light" onclick="backup()">دریافت نسخه پشتیبان</button><button class="btn light" onclick="document.getElementById('restore').click()">بازیابی نسخه پشتیبان</button></div></div>`}function normHead(x){return String(x==null?'':x).toLowerCase().replace(/[\u200c\u200f\ufeff\s_ـ\-()（）:：]/g,'').replace(/[أإآ]/g,'ا').trim()}const fieldAliases={checks:{nationalId:['کد ملی','شناسه ملی'],deal:['کد معامله','معامله'],date:['تاریخ'],status:['وضعیت معامله'],car:['کد خودرو'],due:['تاریخ چک','سررسید','تاریخ سررسید'],principal:['اصل وام'],months:['بازپرداختماه','مدت'],installment:['اقساطماهانه','مبلغ','مبلغ چک'],issuer:['صادرکننده','صاحب چک'],number:['شماره چک'],from:['دریافت از'],to:['واگذار به'],transferDate:['تاریخ واگذاری'],purpose:['واگذاری بابت کد معامله','بابت'],bank:['بانک'],note:['توضیحات'],state:['وضعیت'],balance:['مانده چک']},sales:{brand:['برند'],model:['مدل'],year:['سال'],color:['رنگ'],buyer:['خریدار'],seller:['فروشنده'],buy:['قیمت خرید'],sell:['قیمت فروش'],cost:['هزینه'],profit:['سود'],investor:['سرمایهگذار خادمی'],investor2:['سرمایهگذاردوم'],buyDate:['تاریخ خرید'],sellDate:['تاریخ فروش']},payments:{date:['تاریخ پرداخت','تاریخ'],number:['شماره چک'],amount:['مبلغ'],from:['دریافت از','از'],to:['واگذار به','به'],owner:['صاحب چک'],transferDate:['تاریخ واگذاری'],status:['وضعیت'],type:['نوع عملیات'],note:['توضیحات'],iban:['شبا مقصد']},receipts:{date:['تاریخ پرداخت','تاریخ دریافت','تاریخ'],amount:['مبلغ'],from:['دریافت از'],to:['واگذار به'],transferDate:['تاریخ واگذاری'],type:['نوع عملیات'],note:['توضیحات'],receipt:['رسید'],balance:['مانده']},monthly:{month:['ماه'],amount:['مبلغ','دریافتی'],jalaliMonth:['نام ماه'],year:['سال']},alerts:{due:['تاریخ چک','تاریخ سررسید'],amount:['مبلغ'],owner:['صاحب حساب','صادرکننده'],about:['بابت'],note:['توضیحات'],duration:['مدت هشدار']}};function targetForSheet(name){let n=normHead(name);if(n.includes('چک'))return'checks';if(n.includes('سودفروش')||n.includes('خودرو')||n.includes('معامله'))return'sales';if(n.includes('پرداختبه')||n==='پرداختها'||n==='پرداخت')return'payments';if(n.includes('دریافتاز')||n==='دریافتها'||n==='دریافت')return'receipts';if(n.includes('ورودیم')||n.includes('ماهانه'))return'monthly';return null}function excelValue(v){if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);return typeof v==='string'?v.trim():v}function parseSheetRows(ws,target){let matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true,blankrows:false});if(!matrix.length)return[];let aliases=fieldAliases[target],headerIndex=0; // استاندارد فایل‌ها: سرستون در ردیف اول؛ تشخیص سرستون‌های پایین‌تر هم پشتیبانی می‌شود
let best=-1;for(let i=0;i<Math.min(matrix.length,12);i++){let line=(matrix[i]||[]).map(normHead),score=Object.values(aliases).flat().filter(a=>line.includes(normHead(a))).length;if(score>best){best=score;headerIndex=i}}let heads=(matrix[headerIndex]||[]).map(normHead),mapped={};for(let [field,names] of Object.entries(aliases)){let idx=heads.findIndex(h=>names.some(a=>h===normHead(a)||h.includes(normHead(a))));if(idx>=0)mapped[idx]=field}if(!Object.keys(mapped).length)return[];let out=[];for(let row of matrix.slice(headerIndex+1)){let ob={};for(let [idx,key] of Object.entries(mapped)){let v=excelValue(row[+idx]);if(v!==null&&v!==undefined&&v!=='')ob[key]=key==='nationalId'?String(v).replace(/[^0-9۰-۹٠-٩]/g,'').padStart(10,'0'):v}if(Object.keys(ob).length)out.push(ob)}return out}async function importExcel(ev){let file=ev.target.files&&ev.target.files[0];if(!file)return;await readExcelFile(file);ev.target.value=''}async function readExcelFile(file){let st=document.getElementById('importStatus');try{if(!/\.(xlsx|xlsm)$/i.test(file.name))throw Error('فقط فایل‌های xlsx و xlsm مجاز هستند.');if(typeof XLSX==='undefined')throw Error('کتابخانه خواندن اکسل بارگیری نشده است؛ اتصال اینترنت را بررسی کنید.');let data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array',cellDates:true});let imported={},details=[];for(let sn of wb.SheetNames){let target=targetForSheet(sn);if(!target)continue;let rows=parseSheetRows(wb.Sheets[sn],target);if(rows.length){imported[target]=(imported[target]||[]).concat(rows);details.push(`${sn}: ${rows.length}`)}}if(!Object.keys(imported).length)throw Error('شیت قابل‌شناسایی یا ردیف دارای سرستون معتبر در فایل پیدا نشد.');let mode=document.getElementById('importMode')?.value||'append';let msg=`${details.join('، ')}
${mode==='replace'?'داده‌های بخش‌های موجود در فایل جایگزین':'ردیف‌ها به داده‌های فعلی افزوده'} می‌شوند. ادامه می‌دهید؟`;if(!confirm(msg))return;for(let [key,rows] of Object.entries(imported)){if(mode==='replace')db[key]=rows;else db[key]=(db[key]||[]).concat(rows)}save();st=document.getElementById('importStatus');if(st)st.textContent=`ورود موفق: ${details.join(' · ')}. داده‌ها ذخیره شد.`}catch(e){if(st)st.textContent='خطا: '+(e.message||e);else alert('خطا در ورود فایل: '+(e.message||e))}}function setupDrop(){let z=document.getElementById('excelDrop');if(!z)return;z.ondragover=e=>{e.preventDefault();z.classList.add('drag')};z.ondragleave=()=>z.classList.remove('drag');z.ondrop=e=>{e.preventDefault();z.classList.remove('drag');let f=e.dataTransfer.files[0];if(f)readExcelFile(f)}}document.addEventListener('click',e=>{if(e.target.closest('#tabs')&&globalQuery)clearGlobalSearch()});
render();document.addEventListener("DOMContentLoaded",setupDrop);setTimeout(setupDrop,0);setTimeout(()=>{let c=getFbConfig();if(c.apiKey&&c.databaseURL&&c.projectId)firebaseInit();},0);
</script></body></html>
